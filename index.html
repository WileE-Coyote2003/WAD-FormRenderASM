<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Form</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      color: #222;
      margin: 0;
      padding: 40px 0;
    }

    form {
      width: 1320px;
      max-width: calc(100% - 40px);
      margin: 0 auto;
    }

    fieldset {
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      padding: 8px 18px 14px;
      margin: 0 0 12px 0;
    }

    legend {
      padding: 0 2px;
    }

    .row {
      display: grid;
      grid-template-columns: 255px 1fr;
      align-items: center;
      margin: 8px 0;
    }

    .row.top {
      align-items: start;
    }

    .row > label,
    .row > .label {
      margin: 0;
    }

    input[type="text"],
    input[type="number"],
    input[type="email"] {
      width: 310px;
      height: 38px;
      box-sizing: border-box;
      padding: 4px 8px;
      border: 1px solid #888;
      border-radius: 3px;
      font-size: 16px;
    }

    textarea {
      width: 100%;
      height: 162px;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #888;
      border-radius: 3px;
      font-family: inherit;
      font-size: 16px;
    }

    select {
      height: 54px;
      padding: 0 10px;
      border: 1px solid #888;
      border-radius: 3px;
      background: #fff;
      font-size: 18px;
    }

    .options label {
      margin-right: 4px;
    }

    .options input {
      width: 20px;
      height: 20px;
      margin: 0 2px 0 4px;
      vertical-align: middle;
    }

    .actions {
      text-align: right;
      margin-top: 24px;
    }

    button[type="submit"] {
      background: #0000ff;
      color: #fff;
      border: 2px solid #000080;
      border-radius: 5px;
      padding: 12px 12px;
      font-size: 18px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background: #0000cc;
    }
  </style>
</head>
<body>
  <form action="https://teach-backend-fawn.vercel.app/api/product"
        method="POST"
        enctype="multipart/form-data">

    <fieldset>
      <legend>General Info</legend>

      <div class="row">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" name="itemName">
      </div>

      <div class="row top">
        <label for="itemDescription">Description</label>
        <textarea id="itemDescription" name="itemDescription"></textarea>
      </div>

      <div class="row">
        <label for="category">Category</label>
        <div>
          <select id="category" name="category">
            <option value="notSpecified">notSpecified</option>
            <option value="consumption">consumption</option>
            <option value="household">household</option>
            <option value="electronic">electronic</option>
            <option value="gadget">gadget</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Misc.</legend>
      <!-- <div class="he"></div> -->
      <div class="row">
        <label for="inventoryAmount">Inventory Amount</label>
        <input type="number" id="inventoryAmount" name="inventoryAmount">
      </div>

      <div class="row">
        <label for="listPrice">List price</label>
        <input type="number" id="listPrice" name="listPrice" step="0.01">
      </div>

      <div class="row">
        <span class="label">Available Stores</span>
        <div class="options">
          <input type="checkbox" id="storeBangkok" name="availableStore[]" value="Bangkok"><label for="storeBangkok">Bangkok</label>
          <input type="checkbox" id="storePattaya" name="availableStore[]" value="Pattaya"><label for="storePattaya">Pattaya</label>
          <input type="checkbox" id="storePhuket" name="availableStore[]" value="Phuket"><label for="storePhuket">Phuket</label>
        </div>
      </div>

      <div class="row">
        <span class="label">Available Stores</span>
        <div class="options">
          <input type="radio" id="statusActive" name="status" value="Active"><label for="statusActive">Active</label>
          <input type="radio" id="statusInactive" name="status" value="Inactive"><label for="statusInactive">Inactive</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Staff</legend>

      <div class="row">
        <label for="staffEmail">Staff Email</label>
        <input type="email" id="staffEmail" name="staffEmail">
      </div>
    </fieldset>

    <div class="actions">
      <button type="submit">Submit Form</button>
    </div>
  </form>
</body>
</html>
